[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctkforge"
version = "0.1.0"
description = "CustomTkinter extension components and widgets"
readme = "README.md"
authors = [
    { name = "Rafalus" },
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.png"]
